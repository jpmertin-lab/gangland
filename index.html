function info(){return `<details><summary>So wird gespielt</summary><p>Du läufst über die Stadtkarte. Jeder Zug hat 15 Schritte, ein Auto bringt je nach Modell 5 bis 15 mehr. Ein Gebäude betrittst du, indem du darauf gehst. Aktionen im Gebäude kosten Schritte. Wer 100 Punkte erreicht, ist Gangland King. Im Modus Punkte gewinnt, wer zuerst 100 Punkte hat. Im Modus Zeit gewinnt nach den gewählten Tagen, wer die meisten Punkte hat. Mit höherem Rang schalten sich neue Verbrechen und Autos frei.</p><p>Kämpfe: Tippe eine Figur an, dann ein Feld zum Laufen oder einen Gegner zum Angreifen. Jede Figur handelt pro Runde einmal. Gang-Mitglieder sammeln Erfahrung und steigen auf, können aber fallen. Wer gegen die Polizei verliert, sitzt 2 Tage im Gefängnis, und ein Gangmitglied kann mit verhaftet werden. Löse ihn bei der Polizeizentrale aus, sonst ist er nach 5 Tagen für immer weg.</p><p>Ratenzahlung: Beim Kredithaus, bei dem du Schulden hast, gibt es Teilzahlung (500 $) und einen Ratenplan (täglich 10 Prozent der Schulden, mindestens 50 $, Zinsen nur 3 Prozent). Bandenkrieg: Im Menü erklärst du einem Mitspieler den Krieg. Beide steuern abwechselnd ihre Gang am selben Gerät, auch hier schützen sich Kämpfer gegenseitig.</p><p>Bank bei Nacht: Erst auskundschaften (Sicherheitsstufe 1 bis 3), ab dem nächsten Tag einbrechen. Du rätst den Tresorcode wie bei Mastermind. Mit hoher Intelligenz hast du mehr Versuche, mit hohem Geschick hörst du die erste Ziffer. Nach einem Treffer ist der Tresor 5 Tage leer, für alle Spieler. Ab Intelligenz 6 siehst du pro Stelle, ob eine Ziffer stimmt (✓, ↔, ✗) (richtige Ziffern bleiben nicht stehen). Der Code hat 4, 5 oder 6 Ziffern von 0 bis 9. Es läuft eine Uhr: 60 bis 90 Sekunden plus 3 Sekunden je Punkt Intelligenz.</p><p>Waffen: Pistole (Reichweite 4), Maschinenpistole (6), Schrotflinte (3, sehr starker Schaden, trifft nur nah gut) und Gewehr (9, sehr genau, aber mindestens 2 Felder Abstand). Jede Waffe braucht Werte (zum Beispiel Intelligenz oder Brutalität), die du im Waffenladen vor dem Kauf siehst. Im Kampf blockieren braune Kästen Wege und Schüsse.</p><p>Garagen: Ohne Garage hast du nur ein Auto. Jede Garage (800 $, vier in der Stadt) hat Platz für 5 Autos. Wer in der Garage eines Mitspielers ein Auto klaut, hat 50 % Glück, sonst gibt es einen Kampf mit seiner Bande. Im Kampf schützen Figuren einander: Man kann nicht durch einen Kämpfer hindurchschießen.</p><p>Bahnhof: Taschendiebstahl ist auf 2 Versuche pro Spieler und Spieltag begrenzt, unabhängig davon, welchen Bahnhof oder Güterbahnhof du nutzt. Auch ein Fehlversuch zählt. Das Limit gilt über alle Bahnhöfe zusammen und wird am nächsten Spieltag automatisch erneuert. Du kannst untertauchen (50 $, 2 Tage weg, Fahndungsgrad minus 3) oder einen Kurierauftrag annehmen. Am Güterbahnhof überfällst du Fracht der Moonshiner-Sippe, dafür drohen keine Polizei, aber Rache: Die Sippe lauert dir manchmal auf (Frieden kaufen, weglaufen oder kämpfen). Kämpfe unter Banden erhöhen den Fahndungsgrad nicht. Der Wirt verrät auch Aufträge wie Ärger im Casino, die 2 bis 3 Tage gelten und für alle Spieler offen sind.</p><p>Wachen: Jeder deiner Läden hat eine Wachstärke von 0 bis 5 (150 $ je Stufe, Unterhalt 4 $ pro Stufe und Tag). Banden greifen manchmal an, nach einer Eroberung oder einem Angriff hat der Laden einige Tage Ruhe, und stärkere Wachen schrecken Banden ab. Du hast 2 Tage Zeit, selbst hinzufahren, sonst entscheiden Wachen und Gang automatisch. Tribut kauft dir 7 Tage Ruhe. Wer eine Bande selbst besiegt, bekommt manchmal einen Überläufer.</p><p>Kredithäuser: Es gibt zwei. Ab Rang Schläger kannst du eines für 5000 $ kaufen oder im Kampf erobern. Dann verleihst du Geld (bis 5000 $), bekommst täglich Zinsen (manchmal keine) und treibst bei Zahlungsausfall Außenstände ein. Andere Spieler können es dir abnehmen.</p><p>Menü: Zu Beginn jedes Zuges kannst du in die Stadt gehen, deine Gang ansehen oder dein Inventar prüfen. Zu Spielbeginn würfelt jeder seine Werte aus.</p><p>Schnaps: In der Brennerei (D, im Südosten) kaufst du Fässer, eine Moonshiner-Sippe hält sie besetzt. Dein Auto bestimmt, wie viele du trägst (ohne Auto 2). In Kneipen fragst du den Wirt, ob er heute Fässer will, manchmal will er keine. Mit Fässern an Bord wirst du bei Kontrollen eher erwischt, bei Verhaftung sind sie weg.</p><p>Tempo: Auch dein eigener Charakter trainiert auf der Straße. Für jeweils 60 tatsächlich gelaufene Schritte auf der Stadtkarte steigt dein Tempo um 1, maximal auf 8. Nicht ausgegebene Schritte und Kampfbewegungen zählen nicht; Restfortschritt bleibt erhalten. <p>Training: In Pension und Hotel schickst du Gangmitglieder ins Training (3 Tage +1, 7 Tage +2, Höchstwert 6 oder 9). Läden: Auf der Karte stehen Läden (E). Freie Läden erpresst du, Läden von Banden eroberst du im Kampf, wer einen Laden hält, kassiert Schutzgeld.</p><p>Fahndung: Dein Fahndungsgrad (0 bis 10) steigt mit schweren Taten und sinkt alle 2 Tage ohne Straftat. Bei Kontrollen finden Polizisten eher etwas, wenn du gesucht wirst, einen Steckbrief hast, eine Waffe trägst oder ein heißes Auto fährst. Bestechen wird mit dem Grad teurer, Umlackieren in der Werkstatt ist günstiger.</p><p>Jobs: Bei Verbrechen wählst du, wer sie erledigt. Intelligenz, Geschick und andere Werte entscheiden über den Erfolg.</p></details>
<details><summary>Änderungen</summary><p>Version 0.35: In der Wartehalle des Online-Spiels gibt es jetzt „Zurück zum Start“. Das Spiel bleibt gespeichert und lässt sich mit „Spielstand fortsetzen“ wieder aufnehmen. Die Farbe Lila ist aus der Auswahl genommen, sie passt nicht zur Oberfläche. Im Online-Spiel sieht man die Farbe eines Mitspielers erst, wenn er gewürfelt hat. Bei Sendefehlern steht jetzt ein Hinweis, was man prüfen kann.</p><p>Version 0.34: Die Spielerfarbe wird jetzt gleich beim Würfeln mit angezeigt: Sie wechselt wie die Werte und bleibt dann stehen. Im Online-Spiel würfelt jeder seine Werte jetzt selbst auf seinem eigenen Handy. Der Gastgeber würfelt zuerst, dann ist der Nächste dran, bis alle gewürfelt haben. Der Code steht schon auf dem Würfel-Bildschirm. Erst danach beginnt der erste Spielzug. Das Spiel mit einem Gerät bleibt wie bisher.</p><p>Version 0.33: (1) Jeder Spieler hat eine eigene Farbe, die beim Spielstart ausgewürfelt wird. Sie steht als Farbquadrat vor dem Namen. Läden, Garagen, Brennerei und Kredithäuser sind auf der Karte in der Farbe ihres Besitzers hinterlegt, solange sie ihm gehören. (2) Bevor etwas Geld kostet oder verpflichtet, kommt eine Rückfrage mit Ja und Nein: Kaufen, Anheuern, Mieten, Aufträge annehmen, Überfälle, Waffen. (3) Im Online-Spiel kann man nicht mehr unter einem neuen Code speichern, denn sonst läuft das Spiel für die anderen nicht weiter. Der Stand wird dort bei jedem Zugende automatisch gespeichert. Im Einzelspiel geht ein neuer Code weiter. (4) Sanitäter sind jetzt gut zu erkennen: ein rotes Kreuz auf weißem Grund bei den Bewerbern in der Kneipe, in der Gangliste und im Kampf neben der Figur.</p><p>Version 0.32: Regeländerung bei der Erholung. Gangmitglieder werden nicht mehr nach jedem Zug vollständig geheilt. Verletzungen aus Kämpfen bleiben über das Zugende hinaus. Beim Tageswechsel erholt sich jedes lebende Mitglied einmal um 20 Energie, höchstens bis zum Maximum. Der Sanitäter heilt im Kampf wie bisher, jetzt aber mit dauerhafter Wirkung. In der Gangliste steht die aktuelle Energie („Energie 60 von 100“).</p><p>Version 0.31: Online-Mehrspieler, Stufe 1. Ab 2 Spielern gibt es auf dem Startbildschirm „Online-Spiel starten (jeder am eigenen Handy)“. Du bekommst einen Code, deine Mitspieler geben ihn unter „Online-Spielstand laden“ ein und wählen ihren Namen. Wer dran ist, spielt ganz normal. Mit „Zug beenden“ wird der Stand online gespeichert, die anderen sehen „… ist dran“, und ihr Spiel prüft alle paar Sekunden, ob sie an der Reihe sind. Das geht auf iPhone, Android und am Computer gemischt. Noch keine Meldung auf dem Sperrbildschirm, die Seite muss offen bleiben. Ein neues Spiel setzt jetzt den Online-Code zurück. Keine Regeländerung.</p><p>Version 0.30.3: Fehler beim Online-Speichern behoben (der Online-Dienst antwortet beim Speichern ohne Text, das Spiel hat das fälschlich als Fehler gemeldet). Bei Problemen steht in der Meldung jetzt in Klammern der Grund. Keine Regeländerung.</p><p>Version 0.30.2: Neue Bilder für den Güterbahnhof (Hafenarbeiter mit Kisten, drei Männer in Mänteln) und für beide U-Bahn-Stationen (Bahnsteig Gleis 1 Richtung Loop). Keine Regeländerung.</p><p>Version 0.30.1: Neue Bilder für die Absteige (müder Wirt im Unterhemd, „Zimmer ab 1 Dollar, keine Fragen“) und die Pension (strenger Wirt mit Hut, „Zimmer wochenweise, kein Kredit, keine Ausnahmen“). Keine Regeländerung.</p><p>Version 0.30: Neuer Online-Speicher. Statt des langen Codes bekommst du jetzt beim Speichern einen kurzen Code, zum Beispiel K7M4X-2QP9A. Mit ihm lädst du den Spielstand auf jedem Gerät, auch gleich beim Start unter „Online-Spielstand laden“. Dasselbe Spiel behält seinen Code und wird beim nächsten Speichern überschrieben. Für einen zweiten Spielstand nimmst du „Online speichern mit neuem Code“. Wer den Code kennt, kann den Stand laden und überschreiben, gib ihn also nur an Freunde weiter. Alte lange Codes kannst du weiter in dasselbe Feld einfügen. Online speichern braucht Internet und geht nur in der Version bei GitHub, nicht in der Vorschau bei Claude. Keine Regeländerung.</p><p>Version 0.29: Läden werden seltener angegriffen. Nach einer Eroberung hat der Laden 4 Tage Ruhe, nach jedem Angriff 5 Tage. Die Angriffschance sinkt mit der Wachstärke (5 % plus 2 % je Laden minus 1 % je Wachstärke, mindestens 1 %, höchstens 12 %). Die Bande, die einen Laden gerade verloren hat, greift ihn 7 Tage lang nicht an. Tresor schwerer: Der Code hat 4, 5 oder 6 Ziffern von 0 bis 9 (vorher 3 bis 5 Ziffern von 1 bis 6), richtige Ziffern rasten nicht mehr ein (nur Geschick 7 verrät weiter die erste Ziffer), die Anzeige pro Stelle ab Intelligenz 6 bleibt. Versuche: 5 plus Stufe plus Intelligenz/4, höchstens 10. Die Zeit ist unverändert.</p><p>Version 0.28: Kanadischer Whisky überarbeitet. Beim Abholen am Güterbahnhof gibt es kein Geld mehr. Du musst die Ladung zurück zu der Kneipe bringen, in der du den Auftrag angenommen hast (Bahnhofskneipe, Kneipe oben oder Kneipe unten links). Erst dort gibt es die Bezahlung und 3 Punkte. Ab der Abholung steigt der Fahndungsgrad jede Runde um 1, mindestens 3 Runden lang und weiter, bis die Ladung abgeliefert ist. Wer verhaftet wird, verliert die Ladung, der Auftrag ist dann geplatzt.</p><p>Version 0.27: Aufräumen der Dokumentation und der Versionsangaben. Keine Änderung an Spielregeln oder Anzeigen.</p><p>Version 0.26: Änderungshistorie im Spiel aktualisiert und die letzten Spieländerungen zusammengefasst. Eigenes Tempo trainieren: +1 Tempo je 60 erfolgreich gelaufene Schritte auf der Stadtkarte, bis maximal Tempo 8; Restfortschritt bleibt gespeichert. Taschendiebstahl: höchstens 2 Versuche pro Spieler und Spieltag über alle Bahnhöfe zusammen; Fehlversuche zählen, am Folgetag wird das Limit zurückgesetzt. Grandhotel Chicago: neues Hotelbild eingebaut.</p><p>Version 0.25: Eigenes Tempo steigt durch gelaufene Schritte auf der Stadtkarte: +1 je 60 Schritte, maximal Tempo 8; Fortschritt bleibt über Züge und Spielstand erhalten. Version 0.24: Taschendiebstahl auf maximal 2 Versuche pro Spieler und Spieltag begrenzt, bahnhofübergreifend; Fehlversuche zählen ebenfalls. Tageslimit wird automatisch am nächsten Spieltag erneuert. Version 0.23: Hotelbild (V) im Grandhotel Chicago eingebaut. Version 0.22.1: Kredithaus-Süd-Bild (M) korrigiert (Override IMG.M=IMG.L entfernt). Version 0.22: Charakter-Pool 64, etwas mehr Abwechslung in der Kneipe (leere Tage bleiben möglich). Version 0.21.2: Bild für Kredithaus Süd (M). Version 0.21.1: Mehr Abwechslung bei Erfolgsmeldungen. Version 0.21: Vier neue Aufträge vom Wirt (Türsteher, Whisky, Schulden, Zeugen). Version 0.20.1: Boxkampf im Hinterzimmer (150 $, Brutalität +1 bis 10).</p><p>Version 0.20: Ratenzahlung beim Kredithaus (Teilzahlung und Ratenplan mit automatischer Abbuchung, Zinsen nur 3 Prozent, verpasste Rate zählt als Verzug). Bandenkrieg gegen Mitspieler im Menü (ab 2 Spielern): Erklärung kostet 6 Schritte, der Angegriffene kann Frieden erkaufen (15 Prozent seines Geldes, mindestens 100 $) oder kämpfen, beide steuern ihre Seite abwechselnd, Hindernisse und Schussfeld gelten wie sonst. Sieger bekommt etwa 25 bis 40 Prozent vom Geld des Verlierers und 6 Punkte, der Verlierer 3 Tage Schutz, Ausgeschaltete sind 2 Tage verletzt.</p><p>Version 0.19.1: Tresor bei Nacht gibt jetzt 5, 7 oder 9 Punkte je Stufe (vorher 14). Schulden gehören zu dem Kredithaus, bei dem du sie aufgenommen hast: Kaufst oder eroberst du es, sind sie erledigt. Bei der Auswahl, wer einen Job macht, siehst du jetzt genau die Werte, die zählen (zum Beispiel Brutalität beim Schutzgeld). Polizei, Schläger des Kredithais und die Sippe erklären ihre Lage jetzt in einem Text über den Auswahlknöpfen, auch im Menü.</p><p>Version 0.19: Speichern: Das Spiel speichert sich automatisch (auf diesem Gerät, in diesem Browser) bei jedem Zug und bei jeder Aktion auf der Karte. Beim Start kannst du den Spielstand fortsetzen. Im Menü gibt es „Speichern und Laden“ mit Spielstand-Code zum Kopieren, Einfügen und für ein neues Spiel. Mitten im Kampf oder im Tresorspiel wird nicht gespeichert, ein Neuladen setzt dich auf den letzten Stand davor zurück. Nach größeren Updates kann ein alter Spielstand Lücken haben, fehlende Werte werden mit Standardwerten aufgefüllt.</p><p>Version 0.18: Tresorknacken überarbeitet: Ab Intelligenz 6 zeigt jede Stelle ✓ (richtig), ↔ (andere Stelle) oder ✗ (kommt nicht vor), richtige Ziffern rasten ein und müssen nicht noch einmal getippt werden. Darunter bleibt die Mastermind-Anzeige mit ● und ○. Neu ist ein Zeitlimit mit Balken (Stufe 1: 90, Stufe 2: 75, Stufe 3: 60 Sekunden plus 3 Sekunden je Punkt Intelligenz), höchstens 10 Versuche. Läuft die Zeit ab, schrillt der Alarm. Der Code wird am Ende gezeigt.</p><p>Version 0.17.3: Beim Tresorknacken wird der richtige Code am Ende gezeigt, wenn du scheiterst oder abbrichst.</p><p>Version 0.17.2: Bilder können jetzt je Standort (Schlüssel wie „G@6,2“) und für die Bahnhofskneipe (Schlüssel „R:in“) eingesetzt werden.</p><p>Version 0.17.1: Schach mit dem Wirt hat jetzt acht verschiedene Ausgänge (Sieg, Niederlage, Remis, Unterbrechung). Die Intelligenz steigt immer um 1, egal wie es ausgeht.</p><p>Version 0.17: Bank bei Nacht: Bank auskundschaften (Sicherheitsstufe 1 bis 3), danach nachts den Tresor knacken. Minispiel: Zahlencode raten wie Mastermind (3, 4 oder 5 Ziffern), Versuche hängen von der Intelligenz ab, Geschick verrät die erste Ziffer, du oder ein Gangmitglied deiner Wahl. Beute je nach Stufe 500 bis 2400 $, 14 Punkte, Fahndungsgrad nur +2. Misslingt es, schrillt der Alarm. Ein geleerter Tresor ist 5 Tage lang leer. Der Überfall tagsüber bleibt riskant.</p><p>Version 0.16.1: Bild für die Kredithäuser (Nord und Süd). Im Kampf werden lebende Figuren über gefallenen gezeichnet, wenn sie auf demselben Feld stehen. Beim Waffenkauf nimmt der Händler die alte Waffe zur Hälfte ihres Preises zurück (Messer 40, Pistole 150, Maschinenpistole 600, Schrotflinte 350, Gewehr 700 als Grundpreis). Eine Pistole ist keine Voraussetzung für andere Waffen.</p><p>Version 0.16: Neue Waffen: Schrotflinte (Reichweite 3, Schaden 30, Trefferchance fällt schnell mit Abstand) und Gewehr (Reichweite 9, genau, mindestens 2 Felder Abstand). Waffenkauf über eine Auswahl (Waffe, dann Person) mit Mindestwerten: Pistole Intelligenz 3, Maschinenpistole Intelligenz 5 und Zielen 5, Schrotflinte Brutalität 5, Gewehr Intelligenz 6 und Zielen 6. Hindernisse in allen Kämpfen (4 bis 6 Kästen, blockieren Laufwege und Schüsse). Moonshiner und schwer bewaffnete Polizisten tragen auch Schrotflinten.</p><p>Version 0.15: Kampf: Kämpfer blockieren das Schussfeld (keine Schüsse durch andere Figuren, auch nicht für Gegner). Bahnhofskneipe ist ein eigener Raum im Bahnhof (Wirt nur dort). Garagen: vier Garagen in der Stadt (800 $), ohne Garage nur ein Auto, 5 Plätze je Garage, Autos von Mitspielern klauen (50 % unbemerkt, sonst Kampf). Gefängnis: wartende Entscheidungen verfallen bei Verhaftung, Meldung „Du bist wieder frei“ am ersten freien Tag, bei gesperrter Bewegung erscheint jetzt ein Hinweis statt Stille.</p><p>Version 0.14.1: Fracht überfallen am Güterbahnhof lässt die Polizei aus dem Spiel. Stattdessen gibt es die Rache der Sippe (Stufe 0 bis 5, sinkt alle 3 Tage von selbst): Sie lauert dir manchmal auf, und du kaufst Frieden, läufst weg oder kämpfst. Bei Misserfolg nimmt dir die Sippe Geld ab, es gibt keine Verhaftung. Auch die Kämpfe um Läden, Kredithäuser, Brennerei und Casino erhöhen den Fahndungsgrad nicht mehr.</p><p>Version 0.14: Bahnhof: Schnaps-Schmuggeln entfällt, dafür Untertauchen (Fahndungsgrad sinkt) und Kurierauftrag (Paket zu einem Gebäude bringen). Güterbahnhof: Fracht der Moonshiner-Sippe überfallen (bringt Fässer). Auftragsbrett: Der Wirt verrät Ärger im Casino (2 bis 3 Tage, für alle Spieler), Kampf gegen die Bande bringt Belohnung und Punkte. Inventar zeigt Pakete.</p><p>Version 0.13: Balance: Start mit 300 $ und eine Woche Absteige gratis, Taschendiebstahl 30 bis 110 $ mit nur 1 Punkt (ab Rang Schläger keine Punkte für Kleinkram, ebenso Autodiebstahl), Gläser spülen 25 bis 60 $, Schutzgeld 25 bis 60 $ pro Tag, Kaution 10 Prozent, Bestechen 80 $ plus 30 $ je Grad. Wachen: Wachstärke 0 bis 5 pro Laden mit Unterhalt, Banden greifen eroberte Läden an (automatischer Kampf oder selbst kämpfen, Tribut für 7 Tage Ruhe), Überläufer nach gewonnenem Kampf, Revierbonus ab 3 Läden.</p><p>Version 0.12.1: Bilder für Autohändler, Brennerei (Moonshiner-Sippe) und Kneipe eingebaut, zusammen mit dem Bild von Blüten-Eddy. Die übrigen Gebäude zeigen weiter das einfache Platzhalterbild.</p><p>Version 0.12: Kredithäuser zum Kaufen (5000 $) oder Erobern, Verleihen mit täglichen Zinsen (0 bis 12 Prozent, manchmal keine), Zahlungsausfälle mit Eintreiben durch einen Gangmitglied deiner Wahl, Übernahme durch Mitspieler im Kampf, Meldungen über Zinsen zu Beginn deines Zuges.</p><p>Version 0.11: Würfelbildschirm zu Spielbeginn für jeden Spieler, Menü zu Beginn jedes Zuges (Stadt, Gang, Inventar, Zug beenden), Menü-Knopf auf der Karte, Bild für Blüten-Eddy, Gezinkte Karten bei Eddy und gezinktes Kartenspiel im Casino (Geschick schützt, bei Entdeckung Hausverbot), Mitglieder und du lernen bei gelungenen Jobs manchmal dazu, Polizeikontrollen nennen jetzt den Grund (Steckbrief, heißer Wagen, Schnaps, Waffe, Fahndungsfoto) und gibt es in den ersten 2 Tagen nur bei Fahndungsgrad ab 2, Rechtschreibung korrigiert („Du scheiterst“, „Minus 1 Punkt“).</p><p>Version 0.10: Brennerei (von der Moonshiner-Sippe besetzt, sehr harter Kampf zum Erobern, danach täglich 4 Fässer Nachschub), Fässerhandel mit Tagespreisen, Transportmenge je Automodell (4 bis 16), Wirte kaufen manchmal nichts, Fässer erhöhen das Kontrollrisiko und werden bei Verhaftung beschlagnahmt. Mietwarnung jetzt ab 3 Tagen vor Ablauf.</p><p>Version 0.9: Training in Pension und Hotel (5 Arten, Dauer 3 oder 7 Tage, Plätze und Höchstwert je Stufe, Ausfall bei abgelaufener Miete), kleine Boni für dich (Straße, Zusehen), 8 Läden mit Schutzgeld (frei, von einer Bande besetzt oder von einem Mitspieler), Revierkämpfe und Übernahme.</p><p>Version 0.8.2: Unterkünfte gibt es nur noch für 1, 2 oder 4 Wochen (mit Rabatt: 6 von 7, 11 von 14, 20 von 28 Tagen), die 3-Tage-Miete entfällt. Läuft die Miete ab, bleibt die Gang bestehen, nur neues Anheuern ist nicht mehr möglich.</p><p>Version 0.8.1: Unterkünfte gibt es auch als Woche (7 Tage zum Preis von 6), ein Wechsel der Stufe verfällt weiterhin ohne Erstattung (Hinweis steht dabei), und vor deinem Zug kommt eine Warnung, wenn die Unterkunft nur noch 2 Tage oder kürzer läuft oder abgelaufen ist.</p><p>Version 0.8: Größere Karte (23 mal 19 Felder) mit scrollender Ansicht, zwei Kredithäuser, drei Unterkünfte (Absteige, Pension, Hotel) mit Miete für 3 Tage und Platz für 2, 4 oder 6 Gangmitglieder, zweite Kneipe und zweite Bank, Hauptbahnhof mit eigener Kneipe (Leute je Gebäude getrennt), zweite U-Bahn, Roulette auf Rot oder Schwarz (Einsatz 50, 100 oder 200 $, höchstens 2 Spiele pro Tag).</p><p>Version 0.7.1: Spielmodus wählbar. Punkte: ohne Tagesgrenze, wer zuerst 100 Punkte hat, gewinnt. Zeit: 40, 60 oder 100 Tage. Die Tageswahl erscheint nur noch im Modus Zeit.</p><p>Version 0.7: Zufallswerte für dich (Brutalität, Zielen, Tempo, Energie, Intelligenz, Geschick), Intelligenz und Geschick für alle Gang-Mitglieder, bei jedem Verbrechen wählst du, wer es erledigt (Erfolg hängt von den Werten ab), Fahndungsgrad 0 bis 10 statt Sternen mit Steckbrief, Abkühlung und Kontrollen nach Risiko, Bestechungspreis steigt mit dem Grad, Umlackieren in der Werkstatt, Flucht aus Kämpfen kann scheitern (dann Verhaftung oder Verlust), Minuspunkte bei gescheiterten Jobs und verlorenen Kämpfen, Schach (Intelligenz) und Schießtraining (Zielen).</p><p>Version 0.6: Postzug am Güterbahnhof statt Postkutsche (beide Bahnhöfe zeigen wieder R), Bank und Postzug: bei Alarm hast du die Wahl (bestechen, weglaufen, kämpfen), Gefängnis nach verlorenem Polizeikampf (2 Tage, Gangmitglied kann mit verhaftet werden, Auslösen bei der Polizeizentrale, nach 5 Tagen endgültig weg), Kampffeld mit Kürzeln statt nur Anfangsbuchstaben, Namensliste mit Energie, deutlichere gelbe und rote Felder, Beschreibung der Schritte pro Auto korrigiert.</p><p>Version 0.5: Postkutsche als Zufallsereignis (Tipp vom Wirt), Posthalterei, Werkstatt und 6 Automodelle mit unterschiedlichen Schritten, Auto-Diebstahl mit Zufallsmodell, Falschgeld bei Blüten-Eddy, Kneipe zeigt Leute nur beim Umschauen und pro Tag gleich bleibend, Gläser spülen nur einmal täglich und mit weniger Lohn, Ränge mit Aufstiegsmeldung und Freischaltungen, Spieldauer wählbar (40, 60, 100 Tage), Kampf: pro Runde ein Schritt oder ein Schuss mit Reichweiten-Anzeige, Bank deutlich riskanter.</p><p>Version 0.4: 32 statt 8 Gang-Mitglieder, jeder Charakter gibt es nur einmal im Spiel (Gefallene kommen nie wieder), an manchen Tagen ist die Kneipe leer, nach einer Verhaftung stehst du vor der Polizeizentrale statt am Tatort.</p><p>Version 0.3: Kampfmodus auf dem Feld, 8 Gang-Mitglieder mit eigenen Werten, Erfahrung und Stufen, Kämpfe gegen die Polizei und die Schläger des Kredithais, Kontrollen mit Wahl (bestechen, weglaufen, kämpfen).</p><p>Version 0.2: Neu als Stadtkarte zum Herumlaufen, mit C64-Farben, 11 Gebäuden samt Bild, Schritten pro Zug, Auto, Polizeikontrollen, Papieren, Kredit und Kasino. Version 0.1 (Textmenüs) ist ersetzt.</p><p>Noch nicht dabei: Bandenkrieg zwischen Spielern, Sondermissionen.</p></details>`}
function setup(){app.innerHTML=`<div class=scr><h1>Gangland Chicago</h1><p>Chicago, 1925. Frisch aus dem Gefängnis, und die Stadt wartet.</p>${contBtn()}<p>Wie viele Spieler?</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${[1,2,3,4].map(n=>`<button class="b ${n==np?"on":""}" style="text-align:center" onclick="setN(${n})">${n}</button>`).join("")}</div>${[...Array(np)].map((_,i)=>`<input id=n${i} maxlength=14 placeholder="Name Spieler ${i+1}" value="${esc(names[i]||"")}">`).join("")}<p>Spielmodus?</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">${[["p","Punkte"],["t","Zeit"]].map(m=>`<button class="b ${m[0]==gm?"on":""}" style="text-align:center" onclick="setM('${m[0]}')">${m[1]}</button>`).join("")}</div><p><small>${gm=="p"?"Wer zuerst 100 Punkte hat, gewinnt. Keine Tagesgrenze.":"Nach den gewählten Tagen gewinnt, wer die meisten Punkte hat. Wer vorher 100 Punkte erreicht, gewinnt sofort."}</small></p>${gm=="t"?`<p>Wie viele Tage?</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${[40,60,100].map(n=>`<button class="b ${n==dm?"on":""}" style="text-align:center" onclick="setD(${n})">${n}</button>`).join("")}</div>`:""}<button class=b onclick="start()">Spiel starten (ein Gerät)</button>${np>1?`<button class=b onclick="startOnline()">Online-Spiel starten (jeder am eigenen Handy)</button><p><small>Du bekommst einen Code für die Mitspieler. Es spielt immer nur einer, die anderen warten. Geht auf iPhone, Android und am Computer.</small></p>`:""}${info()}</div>`}

const t=M[p.y+dy][p.x+dx];if(t=="#")return;p.x+=dx;p.y+=dy;p.st--;p.walked=(p.walked||0)+1;let tempoMsg="";if(p.walked>=60){const gains=Math.floor(p.walked/60);p.walked%=60;if(p.s.tp<8){const inc=Math.min(gains,8-p.s.tp);p.s.tp+=inc;if(inc)tempoMsg=` Die Straße hat dich schneller gemacht: Tempo ${p.s.tp} (jeder 60. gelaufene Schritt zählt, höchstens 8).`;}}G.bld=BL[t]?t:null;G.in=null;G.msg=(G.bld?"Du stehst vor dem Gebäude: "+BL[t].n+".":"")+tempoMsg;
